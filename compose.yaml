name: docsage


services: 
  vllm:
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HF_HOME=/cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_API_KEY=${VLLM_API_KEY}
    
    stop_grace_period: 120s

    gpus: all
    
    shm_size: 4g

    command:
      - --model
      - Qwen/Qwen3-4B-AWQ
      - --revision
      - 74d4bd2bd4bff9cafc9345221320bffb08b406a3
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --port
      - "8000"
      - --host
      - "0.0.0.0"
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.80"
      - --max-num-seqs
      - "4"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes

    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    volumes:
      - hf-cache:/cache/huggingface
    networks:
      - internal-net
  
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
      - QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - internal-net
  
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - HF_HOME=/cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
    command:
      - --model-id
      - BAAI/bge-small-en-v1.5
      - --revision
      - 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
      - --api-key
      - ${TEI_API_KEY}
      - --json-output
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80 && echo -e 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    
    volumes:
      - hf-cache:/cache/huggingface
    networks:
      - internal-net
  
  redis:
    image: redis:8.10.3@sha256:f245f4c83b84a9e9a0588da1c9456e579455310f0945d5db52cd2ba27f2000cc
    ports:
      - "127.0.0.1:6379:6379"
    
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - redis-data:/data
    networks:
      - internal-net

  postgres:
    image: postgres:18.6@sha256:e923a22ac074261dd73970c57edf659475bf0497cb9456f17d98ed7cdd3ca913
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - internal-net
  
  litellm:
    image: ghcr.io/berriai/litellm:v1.108.1@sha256:562251f032a0075a5e5a775b8f44aa9f9f1e93d16562892565f29bfa23fbf2f6
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - TEI_API_KEY=${TEI_API_KEY}
      - VLLM_API_KEY=${VLLM_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command:
      - --config
      - /app/config.yaml

    healthcheck:
      test: ["CMD", "/usr/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      postgres:
          condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    networks:
      - internal-net
  

volumes:
  hf-cache:
  qdrant-data:
  redis-data:
  postgres-data:

networks:
  internal-net:
    driver: bridge
