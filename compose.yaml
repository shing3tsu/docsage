name: docsage

volumes:
  hf-cache:
  
networks:
  docsage-net:
    driver: bridge

services: 
  vllm:
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HF_HOME=/cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_API_KEY=${VLLM_API_KEY}

    volumes:
      - hf-cache:/cache/huggingface
    
    stop_grace_period: 120s

    gpus: all
    
    shm_size: 4g

    command:
      - --model
      - Qwen/Qwen2.5-3B-Instruct-AWQ
      - --revision
      - 3559b226e8ce77211e2c1bd7ddfb7686fec4d6dd
      - --port
      - "8000"
      - --host
      - "0.0.0.0"
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.80"
      - --max-num-seqs
      - "4"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes

    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    
    networks:
      - docsage-net

