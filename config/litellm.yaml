model_list:
  - model_name: chat
    litellm_params:
      model: openai/Qwen/Qwen3-4B-AWQ
      api_base: http://vllm:8000/v1
      api_key: os.environ/VLLM_API_KEY
  
  
  - model_name: embed
    litellm_params:
      model: openai/BAAI/bge-small-en-v1.5
      api_base: http://tei:80/v1
      api_key: os.environ/TEI_API_KEY


litellm_settings:
  allow_dynamic_callback_disabling: false
  turn_off_message_logging: false
  redact_user_api_key_info: false

  cache: true
  cache_params:
    type: redis

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_env_credential_login: true
  disable_spend_logs: false
  disable_requester_ip_address_logging: false
  store_model_in_db: true
  store_prompts_in_spend_logs: true

